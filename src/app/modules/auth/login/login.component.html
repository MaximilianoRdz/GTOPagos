<div class="flex flex-col items-center justify-center h-full px-4 sm:px-12 text-center w-full bg-transparent">
  <div class="w-full max-w-sm">

    <!-- Title -->
    <div class="mb-8">
      <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full flex items-center justify-center shadow-lg">
        <lucide-angular [img]="Lock" class="w-8 h-8 text-white"></lucide-angular>
      </div>
      <h1 class="font-bold text-3xl mb-2 text-slate-900 dark:text-white">Iniciar sesión</h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Accede a tu cuenta de planificación financiera</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Email -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 md:pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <input
          type="email"
          formControlName="email"
          placeholder="Correo electrónico"
          class="w-full pl-12 md:pl-10 pr-4 py-4 md:py-3 border border-white/50 dark:border-slate-700/50 rounded-2xl md:rounded-xl focus:ring-2 focus:ring-slate-900 md:focus:ring-emerald-500 dark:focus:ring-emerald-500 focus:border-transparent transition-all duration-200 bg-white/60 dark:bg-slate-900/50 md:bg-white/80 dark:md:bg-slate-800/80 text-slate-900 dark:text-white placeholder-slate-400 text-[15px] md:text-sm"
          required
        />
      </div>

      <!-- Password -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 md:pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 8V6a5 5 0 00-10 0v2M5 10h14v10H5V10z" />
          </svg>
        </div>
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="Contraseña"
          class="w-full pl-12 md:pl-10 pr-12 py-4 md:py-3 border border-white/50 dark:border-slate-700/50 rounded-2xl md:rounded-xl focus:ring-2 focus:ring-slate-900 md:focus:ring-emerald-500 dark:focus:ring-emerald-500 focus:border-transparent transition-all duration-200 bg-white/60 dark:bg-slate-900/50 md:bg-white/80 dark:md:bg-slate-800/80 text-slate-900 dark:text-white placeholder-slate-400 text-[15px] md:text-sm"
          required
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute inset-y-0 right-0 pr-4 md:pr-3 flex items-center cursor-pointer"
        >
          @if (showPassword()) {
            <lucide-angular [img]="EyeClosed" class="h-5 w-5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300"></lucide-angular>
          } @else {
            <lucide-angular [img]="Eye" class="h-5 w-5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300"></lucide-angular>
          }
        </button>
      </div>

      <!-- Forgot Password -->
      <div class="text-right pb-2 md:pb-0">
        <a routerLink="/forgot-password" class="cursor-pointer text-sm font-semibold md:font-normal text-slate-500 md:text-emerald-600 hover:text-slate-900 md:hover:text-emerald-700 dark:text-emerald-500 dark:hover:text-emerald-400 transition-colors duration-200 hover:underline">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="cursor-pointer w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-semibold text-[15px] md:text-base py-4 md:py-3 px-6 rounded-2xl md:rounded-xl hover:from-emerald-700 hover:to-teal-700 transition-all duration-300 shadow-lg shadow-emerald-500/30 hover:shadow-xl mt-4 md:mt-0 transform hover:scale-[1.02]"
      >
        Iniciar sesión
      </button>
    </form>

    <!-- Divider -->
    <div class="relative flex py-3.5 items-center my-1">
      <div class="flex-grow border-t border-slate-300/70 dark:border-slate-700/60"></div>
      <span class="flex-shrink mx-3 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">o explora el proyecto</span>
      <div class="flex-grow border-t border-slate-300/70 dark:border-slate-700/60"></div>
    </div>

    <!-- Demo Account 1-Click Button -->
    <button
      type="button"
      (click)="onDemoLogin()"
      [disabled]="loadingDemo()"
      class="w-full relative overflow-hidden group bg-white/70 hover:bg-white dark:bg-slate-800/70 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-100 font-semibold py-3 px-4 rounded-2xl md:rounded-xl shadow-xs hover:shadow-md border border-slate-200/90 hover:border-emerald-500/50 dark:border-slate-700/80 dark:hover:border-emerald-500/50 transition-all duration-300 flex items-center justify-between gap-2 transform hover:scale-[1.01] active:scale-[0.99] cursor-pointer text-sm disabled:opacity-60 disabled:cursor-not-allowed backdrop-blur-md"
    >
      @if (loadingDemo()) {
        <div class="w-full flex items-center justify-center gap-2 py-1">
          <lucide-angular [img]="Loader2" class="w-4 h-4 text-emerald-600 dark:text-emerald-400 animate-spin"></lucide-angular>
          <span class="text-sm font-medium text-slate-600 dark:text-slate-300">Iniciando sesión demo...</span>
        </div>
      } @else {
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-all duration-300">
            <lucide-angular [img]="Sparkles" class="w-4 h-4"></lucide-angular>
          </div>
          <div class="text-left">
            <span class="block font-bold tracking-tight text-slate-900 dark:text-white text-sm">Acceder como Invitado</span>
            <span class="block text-[11px] font-normal text-slate-500 dark:text-slate-400">Modo Demo con datos de prueba</span>
          </div>
        </div>
        <lucide-angular [img]="ArrowRight" class="w-4 h-4 text-slate-400 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 group-hover:translate-x-1 transition-all duration-200"></lucide-angular>
      }
    </button>
    <p class="mt-2 text-[11px] text-slate-400 dark:text-slate-500 text-center font-normal">
      Acceso instantáneo con datos reales precargados sin necesidad de registro
    </p>

  </div>
</div>
