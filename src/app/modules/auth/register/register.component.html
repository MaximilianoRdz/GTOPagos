<div class="bg-gradient-to-br from-gray-50 to-white flex flex-col items-center justify-center h-full px-6 text-center overflow-y-auto">
  <div class="w-full max-w-sm py-4">
    <div class="mb-6">
      <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full flex items-center justify-center shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 14a4 4 0 00-8 0m8 0v1a4 4 0 01-4 4H8a4 4 0 01-4-4v-1m12 0V7a4 4 0 00-8 0v7" />
        </svg>
      </div>
      <h1 class="font-bold text-2xl mb-2 text-gray-800">Crear Cuenta</h1>
      <p class="text-gray-600 text-sm">Comienza tu planificación financiera</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-3">
      <!-- Nombre -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 15c2.21 0 4.293.535 6.121 1.48M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
        <input type="text" formControlName="name" placeholder="Nombre completo"
          class="w-full pl-10 pr-4 py-2.5 text-sm border rounded-lg bg-white/80 backdrop-blur-sm transition-all duration-200 focus:ring-2 focus:ring-emerald-500 focus:border-transparent border-gray-200" />
      </div>

      <!-- Email -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <input type="email" formControlName="email" placeholder="Correo electrónico"
          class="w-full pl-10 pr-4 py-2.5 text-sm border rounded-lg bg-white/80 backdrop-blur-sm transition-all duration-200 focus:ring-2 focus:ring-emerald-500 focus:border-transparent border-gray-200" />
      </div>

      <!-- Password -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15a1.5 1.5 0 100-3 1.5 1.5 0 000 3z M17 8V6a5 5 0 00-10 0v2 M5 10h14v10H5V10z" />
          </svg>
        </div>
        <input type="password" formControlName="password" placeholder="Contraseña"
          class="w-full pl-10 pr-10 py-2.5 text-sm border rounded-lg bg-white/80 backdrop-blur-sm transition-all duration-200 focus:ring-2 focus:ring-emerald-500 focus:border-transparent border-gray-200" />
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15a1.5 1.5 0 100-3 1.5 1.5 0 000 3z M17 8V6a5 5 0 00-10 0v2 M5 10h14v10H5V10z" />
          </svg>
        </div>
        <input type="password" formControlName="confirm_password" placeholder="Confirmar contraseña"
          class="w-full pl-10 pr-10 py-2.5 text-sm border rounded-lg bg-white/80 backdrop-blur-sm transition-all duration-200 focus:ring-2 focus:ring-emerald-500 focus:border-transparent border-gray-200" />
      </div>

      <!-- Financial Information -->
      <div class="space-y-4">
        <!-- Frecuencia -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 9h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
          <select formControlName="income_frequency"
            class="w-full pl-10 pr-8 py-2.5 text-sm border rounded-lg bg-white/80 backdrop-blur-sm appearance-none transition-all duration-200 focus:ring-2 focus:ring-emerald-500 focus:border-transparent border-gray-200">
            <option value="" disabled selected>Frecuencia de ingresos</option>
            <option *ngFor="let freq of incomeFrequencies" [value]="freq.value">{{ freq.label }}</option>
          </select>
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>

        <!-- Salario and Moneda -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Salario -->
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3m0 0c1.657 0 3-1.343 3-3s-1.343-3-3-3m0 0V5m0 11v3" />
              </svg>
            </div>
            <input type="number" formControlName="salary" placeholder="Salario mensual"
              class="w-full pl-10 pr-4 py-2.5 text-sm border rounded-lg bg-white/80 backdrop-blur-sm transition-all duration-200 focus:ring-2 focus:ring-emerald-500 focus:border-transparent border-gray-200" />
          </div>

          <!-- Moneda -->
          <div class="relative">
            <select formControlName="currency_id"
              class="w-full px-4 py-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200 bg-white/80 backdrop-blur-sm appearance-none border-gray-200">
              <option value="" disabled selected>💰 Moneda</option>
              <option *ngFor="let currency of currencies" [value]="currency.id">
                {{ currency.symbol }} - {{ currency.name }}
              </option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
              <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <button type="submit"
        class="cursor-pointer w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-emerald-700 hover:to-teal-700 transform hover:scale-[1.02] transition-all duration-200 shadow-lg hover:shadow-xl text-sm mt-4">
        Crear Mi Cuenta
      </button>
    </form>
  </div>
</div>
