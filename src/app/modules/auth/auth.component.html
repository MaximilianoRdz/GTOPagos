<div class="flex justify-center items-center min-h-[100dvh] bg-gradient-to-b from-white to-slate-50 dark:from-slate-950 dark:to-slate-900 p-4 lg:p-8 overflow-hidden">
  
  <!-- DESKTOP LAYOUT (Hidden on mobile) -->
  <div
    class="hidden md:block relative bg-gradient-to-br from-gray-50 to-white dark:from-slate-900 dark:to-slate-800 rounded-3xl shadow-2xl overflow-hidden w-full max-w-5xl h-[650px] transition-all duration-700 ease-in-out border border-slate-100 dark:border-slate-800/50"
    [class.right-panel-active]="rightPanelActive"
  >
    <!-- Register Form -->
    <div class="form-container absolute top-0 h-full transition-all duration-700 ease-in-out left-0 w-1/2"
      [class.opacity-100]="rightPanelActive"
      [class.z-50]="rightPanelActive"
      [class.translate-x-0]="!rightPanelActive"
      [class.opacity-0]="!rightPanelActive"
      [class.z-10]="!rightPanelActive"
      [class.translate-x-full]="rightPanelActive"
      >
      <app-register></app-register>
    </div>

    <!-- Login Form -->
    <div class="form-container absolute top-0 h-full transition-all duration-700 ease-in-out left-0 w-1/2"
      [class.opacity-0]="rightPanelActive"
      [class.z-10]="rightPanelActive"
      [class.translate-x-full]="rightPanelActive"
      [class.opacity-100]="!rightPanelActive"
      [class.z-50]="!rightPanelActive"
      [class.translate-x-0]="!rightPanelActive"
    >
      <app-login></app-login>
    </div>

    <!-- Overlay Desktop -->
    <div
      class="overlay-container absolute top-0 left-1/2 w-1/2 h-full overflow-hidden transition-transform duration-700 ease-in-out z-[100]"
      [class.translate-x--full]="rightPanelActive"
      [class.translate-x-0]="!rightPanelActive"
      [class.-translate-x-full]="rightPanelActive"
    >
      <div class="overlay relative left-[-100%] h-full w-[200%] transition-transform duration-600 ease-in-out" style="background: linear-gradient(135deg, #059669 0%, #0d9488 25%, #0891b2 50%, #0284c7 75%, #2563eb 100%)"
        [ngClass]="{
          'translate-x-1/2': rightPanelActive,
          'translate-x-0': !rightPanelActive
        }">
        <!-- Panel Izquierdo Desktop -->
        <div class="overlay-panel absolute flex items-center flex-col justify-center px-12 text-center top-0 h-full w-1/2 left-0 transform translate-x-0 transition-transform duration-600 ease-in-out"
          [ngClass]="{
            '-translate-x-1/4': !rightPanelActive,
            'translate-x-0': rightPanelActive
          }">
          <div class="mb-10">
            <div class="w-24 h-24 mx-auto mb-8 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm shadow-xl shadow-black/10 border border-white/20">
              <lucide-angular [img]="DollarSign" class="w-12 h-12 text-white"></lucide-angular>
            </div>
            <h1 class="text-4xl font-black mb-4 text-white tracking-tight">¡Bienvenido de nuevo!</h1>
            <p class="text-lg font-medium mb-8 text-white/90 leading-relaxed">
              Gestiona tus finanzas de manera inteligente. <br />
              Inicia sesión para continuar con tu planificación.
            </p>
          </div>
          <button
            class="cursor-pointer group relative bg-transparent border-2 border-white text-white rounded-full px-10 py-3.5 font-bold tracking-wide hover:bg-white hover:text-emerald-700 transition-all duration-300 transform hover:scale-[1.02] shadow-lg shadow-black/10"
            (click)="togglePanel(false)"
          >
            <span class="relative z-10">Iniciar Sesión</span>
          </button>
        </div>

        <!-- Panel Derecho Desktop -->
        <div class="overlay-panel absolute flex items-center flex-col justify-center px-12 text-center top-0 h-full w-1/2 right-0 transform translate-x-0 transition-transform duration-600 ease-in-out"
          [ngClass]="{
            'translate-x-1/4': rightPanelActive,
            'translate-x-0': !rightPanelActive
          }"
        >
          <div class="mb-10">
            <div class="w-24 h-24 mx-auto mb-8 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm shadow-xl shadow-black/10 border border-white/20">
              <lucide-angular [img]="ChartNoAxesCombined" class="w-12 h-12 text-white"></lucide-angular>
            </div>
            <h1 class="text-4xl font-black mb-4 text-white tracking-tight">¡Comienza hoy!</h1>
            <p class="text-lg font-medium mb-8 text-white/90 leading-relaxed">
              Crea tu cuenta y toma control de tus finanzas. <br />
              Planifica, ahorra y alcanza tus metas.
            </p>
          </div>
          <button
            class="cursor-pointer group relative bg-transparent border-2 border-white text-white rounded-full px-10 py-3.5 font-bold tracking-wide hover:bg-white hover:text-emerald-700 transition-all duration-300 transform hover:scale-[1.02] shadow-lg shadow-black/10"
            (click)="togglePanel(true)"
          >
            <span class="relative z-10">Crear Cuenta</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MOBILE LAYOUT (Hidden on md and up) -->
  <div class="md:hidden w-full max-w-sm mx-auto flex flex-col justify-center min-h-[85vh] relative z-10">
    <div class="flex flex-col transition-opacity duration-500 ease-in-out">
      
      <!-- Login View -->
      <div [class]="!rightPanelActive ? 'block animate-[fadeIn_0.6s_ease-out]' : 'hidden'">
        <div class="w-full">
          <app-login></app-login>
        </div>
        
        <div class="mt-8 text-center text-sm font-medium text-slate-500 dark:text-slate-400">
          ¿No tienes una cuenta? 
          <button (click)="togglePanel(true)" class="text-slate-900 dark:text-white hover:underline font-bold ml-1 transition-colors cursor-pointer">Regístrate</button>
        </div>
      </div>

      <!-- Register View -->
      <div [class]="rightPanelActive ? 'block animate-[fadeIn_0.6s_ease-out]' : 'hidden'">
        <div class="w-full">
          <app-register></app-register>
        </div>
        
        <div class="mt-8 text-center text-sm font-medium text-slate-500 dark:text-slate-400">
          ¿Ya tienes cuenta? 
          <button (click)="togglePanel(false)" class="text-slate-900 dark:text-white hover:underline font-bold ml-1 transition-colors cursor-pointer">Inicia Sesión</button>
        </div>
      </div>
      
    </div>
  </div>
</div>
