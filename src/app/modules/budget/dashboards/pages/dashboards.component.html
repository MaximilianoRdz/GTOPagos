<main class="flex-1 p-6 text-gray-900 dark:text-gray-100">
  <div class="max-w-7xl mx-auto">
    <div id="tour-budgets-section" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div id="tour-budgets-title">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-gray-100">Mis Dashboards</h1>
        <p class="text-gray-500 dark:text-gray-400">Elige dónde quieres administrar tus pagos</p>
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 w-full sm:w-auto">
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <button
            type="button"
            (click)="startTour()"
            class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-3 sm:px-4 py-2 sm:py-2.5 rounded-2xl text-xs sm:text-sm font-semibold text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200/80 dark:border-emerald-500/30 hover:bg-emerald-100 dark:hover:bg-emerald-500/20 transition-all cursor-pointer shadow-xs active:scale-95"
            title="Ver guía interactiva de presupuestos"
          >
            <lucide-angular [img]="Sparkles" class="w-4 h-4 text-emerald-600 dark:text-emerald-400 shrink-0"></lucide-angular>
            <span class="truncate">Guía de Presupuestos</span>
          </button>

          <input #fileInput type="file" accept=".xlsx,.xls,.csv,.pdf" hidden (change)="onFileChange($event)"/>
          <button
            id="tour-budgets-import"
            type="button"
            (click)="fileInput.click()"
            class="flex-1 sm:flex-none inline-flex items-center justify-center bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-700
            text-slate-700 dark:text-slate-200 px-3 sm:px-5 py-2 sm:py-2.5 rounded-2xl
            font-semibold shadow-sm border border-gray-200 dark:border-slate-700/50
            transition-all duration-200 cursor-pointer text-xs sm:text-sm truncate">
            <span>Importar</span>
          </button>
        </div>

        <button
          id="tour-budgets-create"
          type="button"
          (click)="openCreateModal()"
          class="inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700
          text-white px-4 sm:px-5 py-2.5 rounded-2xl
          font-semibold shadow-lg shadow-emerald-500/20
          transition-all duration-200 cursor-pointer text-sm active:scale-95">
          <lucide-angular [img]="Plus" class="w-4 h-4"></lucide-angular>
          <span>Crear espacio</span>
        </button>
      </div>
    </div>

    @if (loading) {
      <div class="py-12 text-center text-slate-500 dark:text-slate-400 text-sm">Cargando dashboards...</div>
    }

    @if (!loading && dashboards.length === 0) {
      <app-empty-state
        [icon]="Plus"
        title="Aún no tienes ningún espacio"
        description="Los espacios (Dashboards) te permiten separar tu dinero. Puedes crear uno para tu 'Cuenta Bancaria', 'Efectivo', o un 'Presupuesto de Viaje'."
        actionText="Crear mi primer espacio"
        [bordered]="true"
        padding="large"
        (actionClick)="openCreateModal()"
      />
    }

    <div id="tour-budgets-cards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 items-stretch">
      @for (dashboard of dashboards; track dashboard.id) {
        <app-dashboard-card
          [dashboard]="dashboard"
          (select)="openDashboard($event)"
          (edit)="openCreateModal($event)"
          (delete)="deleteDashboard($event)"
        />
      }
    </div>
  </div>
</main>

<app-dashboard-modal
  [isOpen]="showCreateModal"
  [dashboard]="editingDashboard"
  [dashboardTypes]="dashboardTypes"
  (close)="closeCreateModal()"
  (save)="handleDashboardSave($event)"
  (validationError)="alert.show($event, 'error')"
/>

<app-import-modal
  [isOpen]="showImportModal"
  [transactions]="importedTransactions"
  [dashboards]="dashboards"
  [isConfirming]="isConfirmingImport"
  (close)="closeImportModal()"
  (confirm)="handleImportConfirm($event)"
  (validationError)="alert.show($event, 'error')"
/>
