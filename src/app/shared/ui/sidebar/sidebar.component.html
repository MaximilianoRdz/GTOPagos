<div class="flex h-screen bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-800">
  <!-- Sidebar -->
  <div [class]="'relative bg-gradient-to-b from-emerald-900 to-teal-800 dark:from-slate-900 dark:to-slate-800 text-white transition-all duration-300 flex flex-col ' + (sidebarOpen ? 'w-64' : 'w-16')">

    <!-- Header del Sidebar -->
    <div class="flex items-center justify-between h-16 px-4 border-b border-emerald-700 dark:border-slate-700 flex-shrink-0">
      <div [class]="'flex items-center space-x-2 ' + (!sidebarOpen ? 'justify-center' : '')">
        <lucide-angular [img]="DollarSign" class="w-6 h-6 text-emerald-400 dark:text-emerald-300"></lucide-angular>
        @if (sidebarOpen) {
          <span class="text-lg font-bold">GTOPagos</span>
        }
      </div>
    </div>

    <!-- Menu Items -->
    <nav class="flex-1 py-4 overflow-y-auto">
      <div class="space-y-1 px-3">
        @for (item of menuItems; track item) {
          <div>
            <button
              (click)="setActiveSection(item.id)"
            [class]="'cursor-pointer w-full flex items-center px-3 py-2.5 text-left rounded-lg transition-all duration-200 ' +
                    (activeSection === item.id ? 'bg-white text-emerald-900 shadow-sm dark:bg-slate-700 dark:text-slate-100' : 'hover:bg-emerald-700/50 dark:hover:bg-slate-700 text-white')"
              [ngClass]="{ 'justify-center': !sidebarOpen, 'space-x-3': sidebarOpen }">
              <lucide-angular [img]="item.icon" class="w-5 h-5" [class]="!sidebarOpen ? 'mx-auto' : 'mr-3'">
              </lucide-angular>
              @if (sidebarOpen) {
                <span class="flex-1 font-medium text-sm">{{ item.label }}</span>
              }
            </button>
          </div>
        }
      </div>
    </nav>


    <!-- Perfil del Usuario -->
    <div class="flex-shrink-0 p-3 border-t border-emerald-700 dark:border-slate-700">
      @if (sidebarOpen) {
        <div class="flex items-center space-x-3 p-1">
          <div class="relative">
            <div class="w-9 h-9 bg-gradient-to-r from-emerald-400 to-teal-400 dark:from-emerald-500 dark:to-teal-500 rounded-full flex items-center justify-center">
              <lucide-angular [img]="User" class="w-4 h-4 text-emerald-200"></lucide-angular>
            </div>
            <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></div>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-white dark:text-slate-100 truncate">{{ user()?.name }}</p>
            <p class="text-xs text-emerald-200 dark:text-slate-400 truncate">{{ user()?.email }}</p>
          </div>
          <button class="p-1.5 hover:bg-emerald-700 dark:hover:bg-slate-700 rounded-lg transition-colors cursor-pointer" (click)="configuration()">
            <lucide-angular [img]="Settings" class="w-4 h-4 text-emerald-200 dark:text-slate-300"></lucide-angular>
          </button>
        </div>
      }

      @if (!sidebarOpen) {
        <div class="flex justify-center p-1">
          <div class="relative">
            <div class="w-9 h-9 bg-gradient-to-r from-emerald-400 to-teal-400 rounded-full flex items-center justify-center">
              <lucide-angular [img]="User" class="w-4 h-4 text-emerald-200"></lucide-angular>
            </div>
            <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
