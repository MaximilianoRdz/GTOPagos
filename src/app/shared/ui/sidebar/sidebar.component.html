<div class="flex h-screen bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-50">
  <!-- Sidebar -->
  <div [class]="'relative bg-gradient-to-b from-emerald-900 to-teal-800 text-white transition-all duration-300 flex flex-col ' + (sidebarOpen ? 'w-64' : 'w-16')">

    <!-- Header del Sidebar -->
    <div class="flex items-center justify-between h-16 px-4 border-b border-emerald-700 flex-shrink-0">
      <div [class]="'flex items-center space-x-2 ' + (!sidebarOpen ? 'justify-center' : '')">
        <lucide-angular [img]="DollarSign" class="w-6 h-6 text-emerald-400"></lucide-angular>
        <span *ngIf="sidebarOpen" class="text-lg font-bold">GTOPagos</span>
      </div>
    </div>

    <!-- Menu Items -->
    <nav class="flex-1 py-4 overflow-y-auto">
      <div class="space-y-1 px-3">
        <div *ngFor="let item of menuItems">
          <button
            (click)="setActiveSection(item.id)"
            [class]="'w-full flex items-center px-3 py-2.5 text-left rounded-lg transition-all duration-200 ' +
                    (activeSection === item.id ? 'bg-white text-emerald-900 shadow-sm' : 'hover:bg-emerald-700/50 text-white')"
                    [ngClass]="{ 'justify-center': !sidebarOpen, 'space-x-3': sidebarOpen }">
            <lucide-angular [img]="item.icon" class="w-5 h-5" [class]="!sidebarOpen ? 'mx-auto' : 'mr-3'">
            </lucide-angular>
            <ng-container *ngIf="sidebarOpen">
              <span class="flex-1 font-medium text-sm">{{ item.label }}</span>
              <lucide-angular *ngIf="item.hasDropdown" [img]="ChevronDown" class="w-4 h-4">
              </lucide-angular>
            </ng-container>
          </button>
        </div>
      </div>
    </nav>


    <!-- Perfil del Usuario -->
    <div class="flex-shrink-0 p-3 border-t border-emerald-700">
      <div *ngIf="sidebarOpen" class="flex items-center space-x-3 p-1">
        <div class="relative">
          <div class="w-9 h-9 bg-gradient-to-r from-emerald-400 to-teal-400 rounded-full flex items-center justify-center">
            <lucide-angular [img]="User" class="w-4 h-4 text-emerald-200"></lucide-angular>
          </div>
          <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></div>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-white truncate">Juan Pérez</p>
          <p class="text-xs text-emerald-200 truncate">juan&#64;email.com</p>
        </div>
        <button class="p-1.5 hover:bg-emerald-700 rounded-lg transition-colors">
          <lucide-angular [img]="Settings" class="w-4 h-4 text-emerald-200"></lucide-angular>
        </button>
      </div>

      <div *ngIf="!sidebarOpen" class="flex justify-center p-1">
        <div class="relative">
          <div class="w-9 h-9 bg-gradient-to-r from-emerald-400 to-teal-400 rounded-full flex items-center justify-center">
            <lucide-angular [img]="User" class="w-4 h-4 text-emerald-200"></lucide-angular>
          </div>
          <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></div>
        </div>
      </div>
    </div>
  </div>
</div>
