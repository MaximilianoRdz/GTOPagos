<aside id="tour-sidebar" [class]="'hidden md:flex h-screen bg-white/60 dark:bg-slate-900/50 border-r border-white/50 dark:border-slate-700/50 shadow-[4px_0_24px_rgba(0,0,0,0.02)] dark:shadow-[4px_0_24px_rgba(0,0,0,0.2)] transition-all duration-300 flex-col ' + (sidebarOpen ? 'w-64' : 'w-[88px]')">
 
  <!-- HEADER -->
  <div class="flex items-center justify-between h-16 px-4 border-b border-slate-100 dark:border-slate-800/80 flex-shrink-0">
    <div [class]="'flex items-center gap-3 ' + (!sidebarOpen ? 'justify-center w-full' : '')">
      @if (sidebarOpen) {
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-md shadow-emerald-500/20 shrink-0">
          <lucide-angular [img]="DollarSign" class="w-5 h-5 text-white"></lucide-angular>
        </div>
        <span class="text-xl font-bold text-slate-900 dark:text-white tracking-tight flex-1">GTOPagos</span>
      }
      <button (click)="toggleSidebar()" aria-label="Toggle Sidebar" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer" [ngClass]="!sidebarOpen ? 'mx-auto' : ''">
        <lucide-angular [img]="Menu" class="w-5 h-5"></lucide-angular>
      </button>
    </div>
  </div>

 <!-- MENU ITEMS -->
 <nav id="tour-sidebar-nav" class="flex-1 py-6 overflow-y-auto overflow-x-hidden">
 <div class="space-y-1.5 px-3">
 @for (item of menuItems(); track item.id) {
 <button
 (click)="setActiveSection(item.id)"
 [class]="'w-full flex items-center px-3 py-3 rounded-xl transition-all duration-200 cursor-pointer group ' +
 (activeSection === item.id 
 ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400 font-semibold' 
 : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-200')"
 [ngClass]="{ 'justify-center': !sidebarOpen, 'gap-3': sidebarOpen }">
 <lucide-angular [img]="item.icon" class="w-5 h-5 transition-transform group-hover:scale-110" 
 [ngClass]="activeSection === item.id ? 'text-emerald-500 dark:text-emerald-400' : 'text-slate-400 group-hover:text-slate-500 dark:group-hover:text-slate-300'">
 </lucide-angular>
 @if (sidebarOpen) {
 <span class="flex-1 text-left text-[15px]">{{ item.label }}</span>
 }
 </button>
 }
 </div>
 </nav>

 <!-- FOOTER (User & Logout) -->
 <div class="flex-shrink-0 p-4 border-t border-slate-100 dark:border-slate-800/80">
 
 <!-- MENU EXPANDIDO -->
 @if (sidebarOpen) {
 <div class="bg-slate-50 dark:bg-slate-800/50 rounded-2xl p-3 mb-3 flex items-center gap-3 border border-slate-100 dark:border-slate-700/50">
 <div class="relative shrink-0">
 <div class="w-10 h-10 bg-white/60 dark:bg-slate-900/50 border border-white/50 dark:border-slate-700/50 rounded-full flex items-center justify-center shadow-sm">
 <lucide-angular [img]="User" class="w-5 h-5 text-emerald-600 dark:text-emerald-400"></lucide-angular>
 </div>
 <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white dark:border-slate-800 rounded-full"></div>
 </div>
 <div class="flex-1 min-w-0">
 <p class="text-sm font-bold text-slate-900 dark:text-white truncate">{{ user()?.name || 'Usuario' }}</p>
 <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5">{{ user()?.email || 'admin@gtopagos.com' }}</p>
 </div>
 </div>

 <div class="flex items-center gap-2">
 <button (click)="configuration()" class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700 transition-colors cursor-pointer shadow-sm">
 <lucide-angular [img]="Settings" class="w-4 h-4"></lucide-angular>
 Config.
 </button>
 <button (click)="logout()" class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs font-semibold text-red-600 bg-red-50 border border-red-100 hover:bg-red-100 dark:bg-red-500/10 dark:border-red-500/20 dark:text-red-400 dark:hover:bg-red-500/20 transition-colors cursor-pointer shadow-sm">
 <lucide-angular [img]="LogOut" class="w-4 h-4"></lucide-angular>
 Salir
 </button>
 </div>
 }

 <!-- MENU CONTRAÍDO -->
 @if (!sidebarOpen) {
 <div class="flex flex-col gap-3">

  <div class="w-12 h-12 mx-auto bg-white/70 dark:bg-slate-900/60 border border-white/50 dark:border-slate-700/50 rounded-full flex items-center justify-center relative cursor-pointer shadow-sm" aria-label="User Profile">
    <lucide-angular [img]="User" class="w-6 h-6 text-emerald-600 dark:text-emerald-400"></lucide-angular>
    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-white dark:border-slate-900 rounded-full"></div>
  </div>
  <button (click)="configuration()" aria-label="Configuración" class="w-12 h-12 mx-auto rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 transition-colors cursor-pointer" title="Configuración">
    <lucide-angular [img]="Settings" class="w-6 h-6"></lucide-angular>
  </button>
  <button (click)="logout()" aria-label="Cerrar sesión" class="w-12 h-12 mx-auto rounded-xl flex items-center justify-center text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors cursor-pointer" title="Cerrar sesión">
 <lucide-angular [img]="LogOut" class="w-6 h-6"></lucide-angular>
 </button>
 </div>
 }
 </div>
</aside>

<!-- MOBILE BOTTOM NAVIGATION -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200/80 dark:border-slate-800/80 flex items-center justify-between px-1.5 py-1 z-[100] shadow-[0_-4px_24px_rgba(0,0,0,0.05)] pb-safe">
 @for (item of mobileMenuItems(); track item.id) {
 <button (click)="setActiveSection(item.id)" [attr.aria-label]="item.label" class="flex-1 min-w-0 flex flex-col items-center justify-center py-1 px-0.5 rounded-xl gap-0.5 transition-all cursor-pointer select-none" [ngClass]="activeSection === item.id ? 'text-emerald-600 dark:text-emerald-400 font-semibold' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300'">
 <div [class]="'p-1.5 rounded-full transition-all ' + (activeSection === item.id ? 'bg-emerald-50 dark:bg-emerald-500/20 scale-105' : 'bg-transparent')">
 <lucide-angular [img]="item.icon" class="w-5 h-5"></lucide-angular>
 </div>
 <span class="text-[10px] truncate max-w-full leading-tight">{{ item.label }}</span>
 </button>
 }
</nav>
