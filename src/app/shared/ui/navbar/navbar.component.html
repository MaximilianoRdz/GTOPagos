<nav class="bg-gradient-to-r from-emerald-900 to-teal-800 text-white dark:from-slate-900 dark:to-slate-800 h-16 px-6 shadow-lg flex items-center justify-between">
 <div class="flex items-center space-x-4">
 <button (click)="toggleSidebar()" class="p-2 hover:bg-emerald-700 dark:hover:bg-slate-700 rounded-lg transition-colors cursor-pointer">
 <!-- Ícono de menú hamburguesa -->
 <lucide-angular [img]="Menu" class="w-5 h-5"></lucide-angular>
 </button>
 <div class="flex items-center space-x-2 text-sm">
 <span class="text-emerald-200 dark:text-slate-300">Panel Financiero</span>
 <lucide-angular [img]="ChevronRight" class="w-4 h-4 text-emerald-300 dark:text-slate-400"></lucide-angular>
 <span class="font-medium text-white dark:text-slate-100">{{ currentModule }}</span>
 </div>
 </div>
 <div class="flex items-center space-x-3">
 @if (isDemoUser()) {
 <div 
 class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-gradient-to-r from-amber-500/30 to-orange-500/30 border border-amber-400/40 text-amber-200 text-xs font-bold shadow-xs select-none backdrop-blur-md"
 title="Estás explorando GTOPagos en Modo Demo con datos de prueba"
 >
 <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
 <span class="hidden sm:inline">Modo Demo</span>
 <span class="sm:hidden">Demo</span>
 </div>
 }
 <button
 type="button"
 (click)="startTour()"
 class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold backdrop-blur-md border border-white/20 transition-all cursor-pointer shadow-xs active:scale-95"
 title="Guía interactiva de esta sección"
 >
 <lucide-angular [img]="Sparkles" class="w-3.5 h-3.5 text-emerald-300"></lucide-angular>
 <span class="hidden sm:inline">Guía</span>
 </button>
 <div class="text-right">
 <p class="text-sm font-medium capitalize text-white dark:text-slate-100">{{ monthYear }}</p>
 <p class="text-xs text-emerald-200 dark:text-slate-400">Último acceso: {{ lastAccess }}</p>
 </div>
 <div>
 <button class="flex items-center space-x-2 px-3 py-2 rounded-lg transition-colors text-emerald-200 hover:text-red-300 hover:bg-emerald-700 dark:text-slate-300 dark:hover:text-red-400 dark:hover:bg-slate-700 cursor-pointer" (click)="logout()">
 <lucide-angular [img]="LogOut" class="w-4 h-4"></lucide-angular>
 <span>Salir</span>
 </button>
 </div>
 </div>
</nav>
