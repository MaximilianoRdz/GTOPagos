<nav class="bg-gradient-to-r from-emerald-900 to-teal-800 text-white dark:from-slate-900 dark:to-slate-800 h-16 px-3 sm:px-6 shadow-lg flex items-center justify-between">
  <div class="flex items-center space-x-2 sm:space-x-4 min-w-0">
    <button (click)="toggleSidebar()" class="p-2 hover:bg-emerald-700 dark:hover:bg-slate-700 rounded-lg transition-colors cursor-pointer hidden md:flex" aria-label="Menu">
      <lucide-angular [img]="Menu" class="w-5 h-5"></lucide-angular>
    </button>
    <div class="flex items-center space-x-1.5 sm:space-x-2 text-xs sm:text-sm truncate">
      <span class="text-emerald-200 dark:text-slate-300 font-semibold sm:font-normal">GTOPagos</span>
      <lucide-angular [img]="ChevronRight" class="w-3.5 h-3.5 text-emerald-300 dark:text-slate-400 shrink-0"></lucide-angular>
      <span class="font-medium text-white dark:text-slate-100 truncate">{{ currentModule }}</span>
    </div>
  </div>

  <div class="flex items-center space-x-1.5 sm:space-x-3 shrink-0">
    @if (isDemoUser()) {
      <div 
        class="flex items-center gap-1 px-2 sm:px-2.5 py-1 rounded-full bg-gradient-to-r from-amber-500/30 to-orange-500/30 border border-amber-400/40 text-amber-200 text-xs font-bold shadow-xs select-none backdrop-blur-md"
        title="Estás explorando GTOPagos en Modo Demo con datos de prueba"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span class="hidden sm:inline">Modo Demo</span>
        <span class="sm:hidden text-[11px]">Demo</span>
      </div>
    }

    <button
      type="button"
      (click)="startTour()"
      class="flex items-center gap-1.5 px-2 sm:px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold backdrop-blur-md border border-white/20 transition-all cursor-pointer shadow-xs active:scale-95"
      title="Guía interactiva de esta sección"
    >
      <lucide-angular [img]="Sparkles" class="w-3.5 h-3.5 text-emerald-300"></lucide-angular>
      <span class="hidden sm:inline">Guía</span>
    </button>

    <button
      type="button"
      (click)="goToConfiguration()"
      class="flex items-center gap-1.5 p-2 sm:px-3 sm:py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold backdrop-blur-md border border-white/20 transition-all cursor-pointer shadow-xs active:scale-95"
      title="Configuración"
      aria-label="Configuración"
    >
      <lucide-angular [img]="Settings" class="w-4 h-4 text-emerald-200 dark:text-slate-300"></lucide-angular>
      <span class="hidden sm:inline">Config</span>
    </button>

    <div class="text-right hidden lg:block">
      <p class="text-sm font-medium capitalize text-white dark:text-slate-100">{{ monthYear }}</p>
      <p class="text-xs text-emerald-200 dark:text-slate-400">Último acceso: {{ lastAccess }}</p>
    </div>

    <div>
      <button class="flex items-center space-x-1 px-2 sm:px-3 py-1.5 rounded-lg transition-colors text-emerald-200 hover:text-red-300 hover:bg-emerald-700 dark:text-slate-300 dark:hover:text-red-400 dark:hover:bg-slate-700 cursor-pointer text-xs sm:text-sm" (click)="logout()">
        <lucide-angular [img]="LogOut" class="w-4 h-4"></lucide-angular>
        <span class="hidden sm:inline">Salir</span>
      </button>
    </div>
  </div>
</nav>
